<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Secure Code Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<script>
  (function () {
    var t = localStorage.getItem("scp_theme") || "dark";
    if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  })();
</script>
</head>
<body>

<div id="app-shell-root" class="app-shell"></div>

<script type="module">
  import { requireAuth, getCurrentUser } from "./js/modules/auth.js";
  import { renderShell } from "./js/modules/shell.js";
  import { api } from "./js/modules/api.js";
  import { toast } from "./js/modules/toast.js";
  import { gaugeChart, stackedTrendChart, severityDonut } from "./js/modules/charts.js";
  import { formatDate, timeAgo, escapeHtml } from "./js/modules/utils.js";

  if (!requireAuth()) throw new Error("redirecting");

  const user = await renderShell({ active: "dashboard", breadcrumb: [{ label: "Dashboard" }] });
  const content = document.getElementById("page-content");

  content.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Welcome back, ${escapeHtml((user?.full_name || "").split(" ")[0] || "")}</h1>
        <p>Here's your security posture across all scanned projects.</p>
      </div>
      <div class="page-header-actions">
        <a href="upload.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          New Scan
        </a>
      </div>
    </div>
    <div class="grid grid-cols-4" id="stat-cards" style="margin-bottom: var(--sp-5);">
      ${Array(4).fill('<div class="card skeleton-card"></div>').join("")}
    </div>
    <div class="grid grid-cols-3" style="margin-bottom: var(--sp-5);" id="chart-row">
      <div class="card skeleton-card" style="height:280px; grid-column: span 2;"></div>
      <div class="card skeleton-card" style="height:280px;"></div>
    </div>
    <div class="card" id="recent-scans-card">
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton-text" style="width:100%; height:40px;"></div>
      <div class="skeleton-text" style="width:100%; height:40px;"></div>
    </div>`;

  try {
    const stats = await api.get("/dashboard/stats");
    renderStats(stats);
  } catch (err) {
    toast.error("Couldn't load dashboard", err.message);
  }

  function renderStats(stats) {
    document.getElementById("stat-cards").innerHTML = `
      <div class="card stat-card animate-in">
        <div class="stat-card-head">
          <span class="stat-card-label">Total Scans</span>
          <span class="stat-card-icon">${icon("activity")}</span>
        </div>
        <div class="stat-card-value value-glow">${stats.total_scans}</div>
      </div>
      <div class="card stat-card animate-in delay-1">
        <div class="stat-card-head">
          <span class="stat-card-label">Secure Projects</span>
          <span class="stat-card-icon" style="background:var(--verdict-secure-bg); color:var(--verdict-secure);">${icon("shield-check")}</span>
        </div>
        <div class="stat-card-value value-glow" style="color:var(--verdict-secure);">${stats.secure_projects}</div>
      </div>
      <div class="card stat-card animate-in delay-2">
        <div class="stat-card-head">
          <span class="stat-card-label">Vulnerable Projects</span>
          <span class="stat-card-icon" style="background:var(--verdict-vulnerable-bg); color:var(--verdict-vulnerable);">${icon("alert")}</span>
        </div>
        <div class="stat-card-value value-glow" style="color:var(--verdict-vulnerable);">${stats.vulnerable_projects}</div>
      </div>
      <div class="card stat-card animate-in delay-3">
        <div class="stat-card-head">
          <span class="stat-card-label">Detection Accuracy</span>
          <span class="stat-card-icon">${icon("target")}</span>
        </div>
        <div class="stat-card-value value-glow">${stats.detection_accuracy}%</div>
      </div>`;

    document.getElementById("chart-row").innerHTML = `
      <div class="card animate-in" style="grid-column: span 2;">
        <div class="flex items-center justify-between" style="margin-bottom: var(--sp-4);">
          <h3>Scan Trend (14 days)</h3>
          <div class="flex gap-3" style="font-size:var(--fs-xs);">
            <span class="flex items-center gap-2"><span style="width:8px;height:8px;border-radius:50%;background:var(--verdict-secure);display:inline-block;"></span>Secure</span>
            <span class="flex items-center gap-2"><span style="width:8px;height:8px;border-radius:50%;background:var(--verdict-vulnerable);display:inline-block;"></span>Vulnerable</span>
          </div>
        </div>
        ${stackedTrendChart(stats.scans_trend, { height: 200 })}
      </div>
      <div class="card animate-in delay-1 flex flex-col items-center">
        <h3 style="align-self:flex-start; margin-bottom: var(--sp-4);">Security Score</h3>
        ${gaugeChart(stats.average_security_score, { size: 150 })}
        <p style="margin-top: var(--sp-3); font-size: var(--fs-sm); text-align:center;">
          Average across ${stats.total_scans} scan${stats.total_scans !== 1 ? "s" : ""}<br>
          <span style="color:var(--verdict-vulnerable); font-weight:600;">${stats.critical_vulnerabilities} critical</span> finding${stats.critical_vulnerabilities !== 1 ? "s" : ""} found
        </p>
      </div>`;

    const recentCard = document.getElementById("recent-scans-card");
    if (!stats.recent_scans.length) {
      recentCard.innerHTML = `
        <h3 style="margin-bottom: var(--sp-4);">Recent Scans</h3>
        <div class="empty-state">
          ${icon("shield-check", 48)}
          <h3>No scans yet</h3>
          <p>Upload your first project to get a security verdict.</p>
          <a href="upload.html" class="btn btn-primary" style="margin-top:var(--sp-4);">Start a scan</a>
        </div>`;
      return;
    }

    recentCard.innerHTML = `
      <div class="flex items-center justify-between" style="margin-bottom: var(--sp-4);">
        <h3>Recent Scans</h3>
        <a href="history.html" style="font-size:var(--fs-sm);">View all →</a>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Project</th><th>Verdict</th><th>Score</th><th>Findings</th><th>Scanned</th></tr></thead>
          <tbody>
            ${stats.recent_scans
              .map(
                (s) => `
              <tr onclick="window.location.href='results.html?scan_id=${s.id}'">
                <td><strong>${escapeHtml(s.name)}</strong><div class="cell-muted" style="font-size:var(--fs-xs);">${s.total_files} file${s.total_files !== 1 ? "s" : ""}</div></td>
                <td>${verdictBadge(s.verdict, s.status)}</td>
                <td>${s.security_score.toFixed(0)}/100</td>
                <td>${s.vulnerability_count}</td>
                <td class="cell-muted">${timeAgo(s.created_at)}</td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
      </div>`;
  }

  function verdictBadge(verdict, status) {
    if (status !== "completed") {
      const label = status === "running" ? "Running" : status === "failed" ? "Failed" : status === "queued" ? "Queued" : "Cancelled";
      return `<span class="verdict-seal pending"><span class="seal-dot"></span>${label}</span>`;
    }
    return verdict === "secure"
      ? `<span class="verdict-seal secure"><span class="seal-dot"></span>Secure</span>`
      : `<span class="verdict-seal vulnerable"><span class="seal-dot"></span>Vulnerable</span>`;
  }

  function icon(name, size = 18) {
    const paths = {
      activity: `<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>`,
      "shield-check": `<path d="M12 2 4 5v6c0 5.5 3.8 9.7 8 11 4.2-1.3 8-5.5 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/>`,
      alert: `<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4M12 17h.01"/>`,
      target: `<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>`,
    };
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ""}</svg>`;
  }
</script>
</body>
</html>
